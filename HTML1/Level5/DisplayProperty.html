<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
       .Box{
        width:100px;
        height:100px;
        margin:10px;
        background-color:red;
        /* this the block property of the display box */
        display:block;
       }
    </style>
</head>
<body>
    <div id="Box1"class=Box>Box1</div>
    <div id="Box2"class=Box>Box2</div>
</body>
</html>
