<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        #first{
            /* border and padding increases the actual size of the boxes */
            height:50px;
            width:50px;
            background-color: blue;
            padding:10px;
            margin:10px 10px 10px 10px;
            border:10px solid rebeccapurple;
            /* it increase the original box size means content sizeor box size */
           box-sizing: content-box;

           /* content or boxes size reduces it */
           /* box-sizing: border-box; */
        }
    </style>
</head>
<body>
    <div id="first">first</div>
</body>
</html>
