<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding Property</title>
    <style>
        .pad{
            height:50px;
            width:50px;
        }
        *{
            margin:0;
            padding:0;
        }
        #first{
            /* if you give single value like 10px it set automatically top-10px,
            right-10px,bottom-10px,left-10pxaround a box */
            padding:10px;
            /* define the spaces between two object */
            margin:5px 5px 5px 5px;
            background-color: aqua;
        }
        #second{
           padding:10px;
           margin:50px 5px 5px 5px;
           background-color: blue;
        }
    </style>
</head>
<body>
    <div id="first"class="pad">First</div>
    <div id="second"class="pad">Second</div>
</body>
</html>
