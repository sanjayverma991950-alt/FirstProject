<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color</title>
    <link href="Index.css"rel="stylesheet"/>
    <style>
        /* seting up the background color */
       .background{
        color:black;
        background-color:yellow;
        /* here i use the margin paddin for the fixing the whole spaces */
        margin:0;
        padding: 0;
       }
    </style>
</head>
<body>
    <!-- here we are replacind color with the rgb(shortcut) -->
    <div class="background">Background Color</div>
    <div style="background-color: rgb(255,0,0);">First</div>
    <!-- here #=rgb,ff=255,00=0,00=0 as the process is going here -->
    <div style="background-color: #ff0000;">First</div>
    <div style="background-color:rgb(0,255,0)">Second</div>
    <!-- same -->
    <div style="background-color:#00ff00;">Second</div>
    <div style="background-color:rgb(0,0,255)">Third</div>
    <!-- same -->
      <div style="background-color:#0000ff;">Third</div>
    <div style="background-color:rgb(120,150,133)"></div>
    <div style="background-color:rgb(0,0,0)">Hello</div>
</body>
</html>
