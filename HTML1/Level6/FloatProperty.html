<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float _property</title>
    <style>
        #container{
            height:300px;
            width:500px;
            background-color:antiquewhite;
            border:3px solid black;
        }
        .Box{
            height:100px;
            width:150px;
            background-color:blueviolet;
            margin:5px;
            border:3px solid black;
            /* here we can use left,right,none */
            float:right;
        }
    </style>

</head>
<body>
    <div id="container">
        <div id="Box1"class="Box">Box</div>
    </div>
</body>
</html>
