<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practce set</title>
    <style>
        *{
            margin:0;
            padding:0;
            text-decoration: none;
        }
        .link{
            /* remove underline from link */
            /* text-decoration: none; */
            display:flex;
            justify-content: space-around;
            background-color:aqua;
            height:30px;
            padding-top:10px;
        }
        .Imagecontainer{
            border:3px solid red;
            /* height of the image */
            height:250px;
            display:flex;
            justify-content: center;
            align-items: center;
            

       
        }
        .box{
            height:75px;
            width:75px;
            border:3px solid yellow;
        }
        .boxcontainer{
            border:3px solid black;
            display:flex;
            justify-content: space-around;
            height:80px;
            width:350px;
        }
        #box2{
            flex-grow:1;
            flex-shrink:1;
        }
        .mediabox{
            height:50px;
            width:50px;
            background-color: darkblue;
            border:3px solid black;
        }
        @media screen and (min-width:300px) and(max-width:400px){
             .mediabox{
            
            background-color:green;
            
        }
        }
    </style>
</head>
<body>
    <header>
        <nav class="link">
            <a href="#">Home</a>
            <a href="#">Product</a>
            <a href="#">Contact Us</a>
            <a href="#">Support</a>
        </nav>
    </header>
    <main>
        <div class="Imagecontainer">
            <img src="download.jpeg" alt="Ai image">
        </div>
        <div class="boxcontainer">
            <div class="box">box1</div>
            <div id="box2" class="box">box2</div>
            <div class="box">box3</div>
        </div>
        <div class="mediabox">Media Box</div>
    </main>
</body>
</html>
