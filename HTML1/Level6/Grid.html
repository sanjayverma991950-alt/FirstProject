<!--        GRID IS USE FOR MULTIDIMENSIONAL LAYOUT -->
        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        #heading{
           text-align: center;
        }

        #conatiner{
            height:300px;
            width:600px;
            margin:20px;
            padding:10px;
            
            background-color:aqua;
            border:3px solid black;
            display:grid;
            /* here we set all the box at a time onply row or column */
            /* justify-content: center; */
            
            grid-template-columns: 80px 100px;
            grid-template-rows: 50px 100px;


           
            
        }
        .Box{
            /* within the conatiner if box item size incresing to much then what will be happen
            1-box item will not be move to the outside of the conatiner anyway this is help to make website more 
            responsive */
            height:75px;
            width:75px;
            border:3px solid black;
            margin:5px;

            
            
        }
        #Box1{
            grid-row:1/2;
            grid-column:1/2;
            background-color:brown;


        }
        #Box2{
            grid-row:1/2;
            grid-column:2/2;
            background-color:green;
            /* flex-shrink: 5 ;*/
          
            /* box2 will not be small always fixed if 0 */
            /* flex-shrink:0;
            flex-grow: 1; */
        }
        #Box3{
            grid-row:2/2;
            grid-column:1/2;
            background-color:yellow;
        
        }
        #Box4{
            grid-row:2/2;
            grid-column:2/2;
            background-color:pink;
        }
    </style>
</head>
<body>
    <h1 id="heading">Grid conatainer</h1>
    <div id="conatiner">
        <div id="Box1"class="Box">Box1</div>
        <div id="Box2"class="Box">Box2</div>
        <div id="Box3"class="Box">Box3</div>
        <div id="Box4"class="Box">Box4</div>
      
    </div>
</body>
</html>
