<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseode classes</title>
    <style>
        .Button{
            height:25px;
            width:100px;
            background-color:darkgreen;
            border-radius:10px;
            border:3px solid yellow;
        }
        .Button:hover{
            /* whengoing to click it changing its original button */
            height:45px;
            width:150px;
            background-color:brown;
            border-radius:10px;
        }
        .Button:active{
            /* it statse of thr button when click the change the color */
            height:45px;
            width:150px;
            background-color:antiquewhite;
              
        }
    </style>
</head>
<body>
    <div class="Button">Button</div>
</body>
</html>
